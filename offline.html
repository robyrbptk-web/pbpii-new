<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c2948">
  <title>Sedang offline — PB PII</title>
  <link rel="icon" href="/assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f2f6f9}
    main{width:min(100%,480px);border:1px solid #e0e7ef;border-radius:18px;padding:32px;background:#fff;text-align:center}
    img{width:78px;height:78px;object-fit:contain}
    h1{margin:18px 0 8px;color:#102b49;font-size:1.8rem}
    p{color:#637184}
    button{min-height:46px;border:0;border-radius:10px;padding:0 18px;background:#102b49;color:#fff;font:inherit;font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="/assets/icon-192.png" alt="Logo PII">
    <h1>Anda sedang offline</h1>
    <p>Halaman yang tersimpan tetap bisa dibuka. Hubungkan kembali ke internet untuk memuat kabar terbaru.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
  <script src="site.js" defer></script>
</body>
</html>
